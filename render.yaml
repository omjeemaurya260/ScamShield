services:
  - type: web
    name: scamshield
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: ""
      - key: DATABASE_NAME
        value: scamshield
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
